<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon" />
    <script
      src="https://kit.fontawesome.com/0bb154f3a0.js"
      crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css" />

    <title>Clase 12 | Comisión 96015</title>
  </head>
  <body>
    <main>
      <h1><span>Clase 12</span></h1>
      <hr />
      <h2>Asincronia y promesas</h2>

      <p class="mensaje"></p>

      <div class="card hide">
        <h2>👋​ Soy un pop-up</h2>
        <p>Voy a desaparecer pronto! ⏳​</p>
      </div>
      <!-- <input type="text" id="text"> -->
      <button type="button" class="btn btn-normal" id="btn">Click</button>
      <div class="contenedor">
        <!-- contenido dinámico -->
        <p>CARGANDO...⏱️  <i class="fa-solid fa-spinner animation"></i></p>
      </div>

      <h2>Formulario</h2>
        <form id="form-login">
          <input type="text" placeholder="Usuario" id="user" name="user" />
          <input type="password" placeholder="Password" id="pass" name="pass" />
          <div class="check">
            <label for="check">Recordar</label>
            <input type="checkbox" id="check" name="check" />
            <p id="message"></p>
          </div>
          <input
            type="submit"
            class="btn btn-login"
            value="Ingresar"
            name="enviar" />
        </form>
    </main>

    <script>
      console.log("Hola mundo");

    <!-- si -->
    <script src="./js/main.js"></script>
  </body>
