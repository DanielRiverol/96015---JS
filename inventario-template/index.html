<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Admin Remeras</title>
  </head>
  <body>
    <div class="container-fluid" style="padding: 20px">
      <div class="row">
        <div class="col s12 m3">
          <h5>Nuevo Producto</h5>
          <hr />
          <form id="form-ingreso">
            <div class="input-field">
              <input id="nombre" type="text" class="validate" />
              <label for="nombre">Nombre</label>
            </div>
            <div class="input-field">
              <input id="descripcion" type="text" class="validate" />
              <label for="descripcion">Descripción</label>
            </div>
            <div class="row">
              <div class="input-field col s6">
                <input id="precio" type="number" class="validate" />
                <label for="precio">Precio ($)</label>
              </div>
              <div class="input-field col s6">
                <select id="select-talle">
                  <option value="no disponible" disabled selected>Talle</option>
                </select>
              </div>
            </div>

            <div class="file-field input-field">
              <div class="btn cyan">
                <span>Foto</span>
                <input type="file" id="img" accept="image/*" />
              </div>
              <div class="file-path-wrapper">
                <input
                  class="file-path validate"
                  type="text"
                  placeholder="Subir archivo" />
              </div>
            </div>

            <button
              type="button"
              id="btnGuardar"
              class="btn waves-effect waves-light col s12 cyan darken-2">
              Guardar Producto
            </button>
          </form>
        </div>

        <div class="col s12 m9">
          <h5>Listado de Productos</h5>
          <hr />
          <div class="row" id="contenedor"></div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="./js/materialize.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
