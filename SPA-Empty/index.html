<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./img/logo.ico" type="image/x-icon">
    <link
      href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <title>SPA - LIVE</title>
  </head>

  <body>
    <main>
      <!-- Background -->
      <section class="bg-box">
        <img alt="bg" />
      </section>
      <section class="content-box">
        <div class="form-box">
          <div class="logo-box">
            <img src="./img/logo.png" id="logo" alt="" />
            <h2>Inicio de Sesión</h2>
          </div>

          <div class="login">
            <form action="" id="login">
              <div class="input-box">
                <label for="user">Usuario</label>
                <input type="text" id="user" />
              </div>
              <div class="input-box">
                <label for="pass">Contraseña</label>
                <input type="password" id="pass" />
              </div>
             <!--  -->
              <div class="input-box">
                <input type="submit" value="Ingresar" id="ingresar" />
              </div>
              <p id="mensaje"><!-- contenido dinamico --></p>
              <div class="input-box">
                <span class="mensaje">¿No tiene cuenta? </span
                ><a href="register.html" class="link">Regístrese</a>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.19/dist/sweetalert2.all.min.js"
      integrity="sha256-NRwwtY2+HbkYyns4qhoHF9I40fpkeEM1DcsyzGi3lTs="
      crossorigin="anonymous"
    ></script>
    <script src="./js/main.js"></script>
    <script src="./js/login.js"></script>
   
  </body>
</html>
