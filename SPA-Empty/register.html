<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./img/logo.ico" type="image/x-icon">
    <link
      href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <title>SPA - LIVE</title>
  </head>

  <body>
    <main>
      <!-- Background -->
      <section class="bg-box">
        <img alt="" />
      </section>
      <section class="content-box">
        <div class="form-box">
          <div class="logo-box">
            <img src="./img/logo.png" id="logo" alt="" />
            <h2>Registro</h2>
          </div>

          <div class="register">
            <form action="" id="formReg">
              <div class="input-box">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" />
              </div>
              <div class="input-box">
                <label for="userReg">Usuario</label>
                <input type="text" id="userReg" />
              </div>
              <div class="input-box">
                <label for="email">Email</label>
                <input type="text" id="email" />
              </div>
              <div class="input-box">
                <label for="passReg">Contraseña</label>
                <input type="password" id="passReg" />
              </div>
              <div class="input-box">
                <input type="submit" value="Registrar" id="registrar" />
            
              </div>
              <div class="input-box">
                <span class="mensaje">¿Ya tiene cuenta? </span
                ><a href="/" class="link">Inicie sesión</a>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <script src="./js/main.js"></script>
    <script src="./js/register.js"></script>
  </body>
</html>
